# GVD M5 control / shadow / E2E (sim toy — not real-car).
policy_default: modular   # modular | e2e | shadow
e2e:
  input_w: 320
  input_h: 180
  cams: [main, wide]
  model: models/e2e_current.onnx
  # Toy VRAM budget when ONNX/EP present; stub uses CPU numpy.
  vram_gb_min: 0.15
  vram_gb_max: 0.4
veto:
  # Modular safety supervisor thresholds (vetoes E2E apply).
  lane_conf_min: 0.25
  path_conf_min: 0.15
  steer_disagree_max: 0.55
shadow:
  # Always compute both intents; actuators only when engaged + modular OK.
  write_fields: true
  apply_e2e_when: never   # shadow applies modular; e2e policy applies e2e if no veto
