name: offline tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            .github/workflows/tests.yml

      - name: Lua 5.1 and a display
        run: sudo apt-get update && sudo apt-get install -y lua5.1 xvfb

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-retail.txt -r requirements-viz.txt onnx
          # CPU-only wheels for the trainer / ONNX export tests (no CUDA download).
          # Same torch / torchvision / scipy versions as the dev PC, without the +cu126 suffix.
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install scipy==1.18.1

      - name: Offline suite
        # opencv's Qt build only ships the xcb plugin. A headless runner aborts
        # in cv2.namedWindow (the train panel). xvfb is a display, not offscreen Qt.
        run: xvfb-run -a python scripts/run_offline_suite.py
