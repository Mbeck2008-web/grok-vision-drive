# GVD M5 control / shadow / E2E (sim toy — not real-car).
policy_default: modular   # modular | e2e | shadow
e2e:
  input_w: 320
  input_h: 180
  # Live image is the flat 360 strip. main+wide is only the no-stitch fallback.
  cams: [stitch360]
  model: models/e2e_current.onnx
  # Toy VRAM budget when ONNX/EP present; stub uses CPU numpy.
  vram_gb_min: 0.15
  vram_gb_max: 0.4
veto:
  # Modular safety supervisor thresholds (vetoes E2E apply).
  lane_conf_min: 0.25
  path_conf_min: 0.15
  steer_disagree_max: 0.55
  # Kept so older callers can still read a rate name. Not an Engage gate.
  # Separate from the 8 Hz CAMS blit drop and the 10 Hz narrow-far hitch.
  min_accept_hz: 6
  engage_hz_grace_s: 3.0
  engage_hz_grace_floor: 5
shadow:
  # Always compute both intents; actuators only when engaged + modular OK.
  write_fields: true
  apply_e2e_when: never   # shadow applies modular; e2e policy applies e2e if no veto
override:
  # Driver override on the steer *residual* (steering_input - the cmd.steer that was in force),
  # never an absolute angle: force-feedback wheels move steering_input around whatever GVD
  # commands, and M6's bare "|steering_input| > 0.55" read that chatter as a driver and
  # disengaged. Research pin magnitudes — live FFB behaviour is still UNPROVEN.
  # Steer: residual -> spike reject -> EMA -> soft opposition bias -> hysteresis -> dwell.
  steer_enter: 0.08      # filtered residual above this starts the dwell
  steer_exit: 0.04       # and must fall back under this to discharge it (hysteresis)
  steer_hold_ms: 200     # how long the player has to keep pushing one way to count
  steer_spike: 0.20      # sample-to-sample jump past this is mechanical: the filter holds
  lpf_tau_ms: 80         # EMA time constant, on the residual only
  # Tech steer hold only. Straight/centre deadband on the physical wheel.
  # A wheel resting at 0.10 from force-feedback or centring slop stays inside
  # it. A held 0.25 in any direction (straight, past the command, or opposite)
  # is past it and drops Engage after the dwell. Retail Lua does not use this.
  steer_center_deadband: 0.15
  # Pedals asymmetric and tight: no filter, no dwell, one-sided (only a press beyond what GVD
  # asked for), and brake lower than throttle.
  brake_enter: 0.06
  throttle_enter: 0.10
