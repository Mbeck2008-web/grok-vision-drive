<div class="gvd-strip" id="gvdStripRoot">
  <style>
    .gvd-strip {
      box-sizing:border-box; display:flex; align-items:center; height:100%; width:100%;
      padding:0 12px; background:rgba(7,8,10,0.88); border:1px solid #2a333b; border-radius:4px;
      font-family:Consolas,monospace; font-size:13px; color:#8b939c; letter-spacing:0.02em;
    }
    .gvd-strip.is-on { border-color:#5aa7c7; color:#9ec4d4; }
    .gvd-strip.is-drive { border-color:#9ec4d4; color:#dbeef8; }
    .gvd-strip.is-hold { border-color:#d8a54a; color:#d8a54a; }
    .gvd-strip.is-mismatch { border-color:#d07070; color:#e8a0a0; }
  </style>
  <span id="gvdStripText">GVD  --  --Hz  TTC --  N=0</span>
</div>
