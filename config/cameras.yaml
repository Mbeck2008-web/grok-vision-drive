# GVD 8-cam rig (toy analogues of an HW3-class windshield/pillar/repeater/rear layout).
# Positions are GVD vehicle frame: +X right, +Y forward, +Z up (drafts — calibrate on ETK800).
# BeamNGpy Camera vehicle space is +X left, +Y backward, +Z up; python/sensors/tech.py converts
# at attach (config/tech.yaml cameras.convert_gvd_frame). Comments say "toy analogue of …",
# never a vendor camera name. BeamNGpy uses FOV_v (field_of_view_y). live_res long side ≤ 640.
#
# BeamNGpy Camera defaults near_far_planes=(0.05, 100) m (BeamNGpy#199). GVD always passes
# an explicit (near_m, far_m) + requested_update_time from this file. near is 0.05 on every cam.
# Locked far_m (narrow > main; never both-800). Grab stagger is Python-side (not resolution).
# Every grab is main plus at most one companion (≤2 colour reads):
#   main:    every tick (÷1)
#   wide:    ÷4 phase 0 (ticks 0 and 4)
#   pillarL: ÷8 phase 1
#   narrow:  ÷8 phase 2 (never shares a tick with wide)
#   pillarR: ÷8 phase 3
#   repeatL: ÷8 phase 5
#   rear:    ÷8 phase 6 (no side on this slot)
#   repeatR: ÷8 phase 7
# Far / GPU (stream_raw on forwards; never is_streaming=False):
#   narrow: 800 @ 0.067  priority 0.5   (next far hitch 400 only if live unique-frame Hz <10)
#   main:   300 @ 0.067  priority 0.0
#   wide:   300 @ 0.067  priority 0.5
#   pillarL / pillarR / repeatL / repeatR / rear: 100 @ -1 (on-demand; no auto GPU)
# Optional per-cam near_far_planes: [near_m, far_m] still clamped to the role band.
# Hitch: forward grab stagger + on-demand sides/rear — not resolution. Depth OFF.
origin_offset: [0.0, 0.0, 0.0]
near_m: 0.05
hitch:
  main_grab_div: 1
  wide_grab_div: 4
  wide_grab_phase: 0     # ticks 0 and 4 with main
  narrow_grab_div: 8
  narrow_grab_phase: 2   # own slot; never the wide tick or a pillar tick
  side_grab_div: 8
  side_grab_phase: 1     # pillarL; pillarR steps +2
  repeat_grab_div: 8
  repeat_grab_phase: 5   # repeatL; repeatR steps +2
  rear_grab_div: 8
  rear_grab_phase: 6     # main+rear; no side companion
# OpenCV cabin only. Does not set BeamNGpy clip planes or the hitch ladder.
# auto = that camera's far_m after hitch (state main_far_m / rear_far_m when set).
viz:
  draw_ahead_m: auto      # auto = main.far_m after hitch
  draw_behind_m: auto     # auto = rear.far_m
  ahead_min_m: 80
  ahead_max_m: 400        # 1080 Ti mid cap
  behind_min_m: 20
  behind_max_m: 80
  fade_frac: 0.28         # furniture/lanes fade in the last 28% of AHEAD range
cameras:
  - id: narrow
    role: long_range_forward
    note: "toy analogue of a narrow forward windshield cam"
    mount: windshield_cluster
    pos_m: [0.03, 1.20, 1.28]
    yaw_deg: 0
    pitch_deg: -4
    fov_v: 21.4
    live_res: [640, 480]
    far_m: 800
    requested_update_time: 0.067
    update_priority: 0.5
  - id: main
    role: primary_forward
    note: "toy analogue of the primary forward windshield cam; alias cam_main"
    mount: windshield_cluster
    pos_m: [0.00, 1.20, 1.26]
    yaw_deg: 0
    pitch_deg: -6
    fov_v: 34.0
    live_res: [640, 480]
    far_m: 300
    requested_update_time: 0.067
    update_priority: 0.0
    aliases: [cam_main]
  - id: wide
    role: urban_intersection
    note: "toy analogue of a wide forward windshield cam"
    mount: windshield_cluster
    pos_m: [-0.03, 1.20, 1.24]
    yaw_deg: 0
    pitch_deg: -8
    fov_v: 88.7
    live_res: [640, 480]
    far_m: 300
    requested_update_time: 0.067
    update_priority: 0.5
  - id: pillarL
    role: forward_side_left
    note: "toy analogue of a left B-pillar forward-side cam"
    mount: left_b_pillar
    pos_m: [-0.88, 0.40, 1.18]
    yaw_deg: -38
    pitch_deg: -6
    fov_v: 65.3
    live_res: [640, 480]
    far_m: 100
    requested_update_time: -1
    update_priority: 1.0
  - id: pillarR
    role: forward_side_right
    note: "toy analogue of a right B-pillar forward-side cam"
    mount: right_b_pillar
    pos_m: [0.88, 0.40, 1.18]
    yaw_deg: 38
    pitch_deg: -6
    fov_v: 65.3
    live_res: [640, 480]
    far_m: 100
    requested_update_time: -1
    update_priority: 1.0
  - id: repeatL
    role: rear_side_left
    note: "toy analogue of a left fender repeater"
    mount: left_front_fender
    pos_m: [-0.96, 1.45, 0.82]
    yaw_deg: -128
    pitch_deg: -8
    fov_v: 55.4
    live_res: [640, 480]
    far_m: 100
    requested_update_time: -1
    update_priority: 1.0
  - id: repeatR
    role: rear_side_right
    note: "toy analogue of a right fender repeater"
    mount: right_front_fender
    pos_m: [0.96, 1.45, 0.82]
    yaw_deg: 128
    pitch_deg: -8
    fov_v: 55.4
    live_res: [640, 480]
    far_m: 100
    requested_update_time: -1
    update_priority: 1.0
  - id: rear
    role: rear_traffic
    note: "toy analogue of a rear license-plate cam"
    mount: above_license_plate
    pos_m: [0.00, -2.25, 0.78]
    yaw_deg: 180
    pitch_deg: -10
    fov_v: 80.0
    live_res: [640, 360]
    far_m: 100
    requested_update_time: -1
    update_priority: 1.0
