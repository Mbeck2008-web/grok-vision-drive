# Default hardware profile. max_inference_vram_gb is the inference cap.
# There is no CLI --profile unlimited.
profile: gtx_1080_ti
cpu: i9-9900k
system_ram_gb: 32
max_inference_vram_gb: 4
live_input_long_side: 640
target_hz_min: 10
target_hz_happy: 15
dgpu:
  name: GTX 1080 Ti
  vram_gb: 11
  # Cabin ahead cap (cameras.yaml viz.ahead_max_m) rises to 600 when vram_gb >= 16.
  # This 11 GB profile stays clamped at 400. Do not raise live_input_long_side or max_inference_vram_gb.
  arch: pascal
  tensor_cores: false
igpu: uhd_630
igpu_roles: [qsv_encode, optional_osd_display]
ram_budget_gb:
  windows: 6
  beamng: 12
  gvd_peak: 10
  clip_ring: 2
  unallocated_headroom: 4
encode:
  backend: qsv          # h264_qsv / hevc_qsv
  fallback: cpu         # libx264 if QSV missing
  never: nvenc          # do not spend 1080 Ti on encode unless QSV fails AND --encode nvenc
