name: offline tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GVD_REQUIRE_LIVE: "1"
    steps:
      - name: Put /tmp on disk
        # ubuntu-26.04 mounts /tmp as a RAM tmpfs (about 7.8 GB). The suite writes
        # under /tmp and the collector refuses under 20 GB free, so unmount the
        # tmpfs and let /tmp fall back to the root disk.
        run: |
          df -h /tmp
          echo "before: /tmp fstype=$(findmnt -n -o FSTYPE /tmp || echo none)"
          fstype=$(findmnt -n -o FSTYPE /tmp || true); if [ "$fstype" = "tmpfs" ]; then sudo systemctl mask tmp.mount && sudo umount -l /tmp; else echo "/tmp is ${fstype:-none}, not tmpfs; skipping unmount"; fi
          df -h /tmp
          fstype=$(findmnt -n -o FSTYPE /tmp || true)
          echo "after: /tmp fstype=${fstype:-none (on /)}"
          if [ "$fstype" = "tmpfs" ]; then
            echo "::error::/tmp is still tmpfs after unmount"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            .github/workflows/tests.yml

      - name: Lua 5.1 and a display
        run: sudo apt-get update && sudo apt-get install -y lua5.1 xvfb

      - name: C++ viz toolchain (CMake, Ninja, Mesa EGL, X11 for GLFW)
        # xorg-dev turns GVD_VIZ_GLFW on; libglfw3-dev supplies a system GLFW
        # so CI does not have to compile the pinned 3.4 tarball (which would
        # need wayland-scanner). Offline renders still use EGL surfaceless;
        # ctest is wrapped in xvfb only so glfwCreateWindow has a display.
        run: sudo apt-get install -y cmake ninja-build g++ libegl1 libegl-mesa0 libgl1-mesa-dri xorg-dev libglfw3-dev

      - name: C++ viz build + ctest (headless EGL + GLFW under xvfb)
        # docs/specs/viz_cpp.md. glad/stb are vendored; glm + nlohmann_json are
        # pinned FetchContent tarballs. Renders on Mesa llvmpipe (no GPU).
        working-directory: cpp/viz
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release --parallel
          ./build/linux-release/gvd_viz --info --offline tests/scenes/basic.jsonl --png build/ci_basic.png
          echo "GVD_REQUIRE_LIVE=${GVD_REQUIRE_LIVE}"
          xvfb-run -a ctest --preset linux-release

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-retail.txt -r requirements-viz.txt onnx
          # CPU-only wheels for the trainer / ONNX export tests (no CUDA download).
          # Same torch / torchvision / scipy versions as the dev PC, without the +cu126 suffix.
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install scipy==1.18.1
          # Dev-only: property/fuzz tests (scripts/test_learned_lanes_props.py). Not a runtime dep.
          python -m pip install -r requirements-dev.txt

      - name: Disk guard (22 GB free on /tmp)
        run: |
          df -h /tmp
          free_kb=$(df --output=avail -k /tmp | tail -1 | tr -d ' ')
          free_gb=$((free_kb / 1024 / 1024))
          if [ "$free_kb" -lt $((22 * 1024 * 1024)) ]; then
            echo "::error::only ${free_gb} GB free on /tmp, need 22 GB (collector tests refuse under 20 GB)"
            exit 1
          fi
          echo "disk guard ok: ${free_gb} GB free on /tmp"

      - name: Offline suite
        # opencv's Qt build only ships the xcb plugin. A headless runner aborts
        # in cv2.namedWindow (the train panel). xvfb is a display, not offscreen Qt.
        env:
          GVD_VIZ_BUILD_DIR: ${{ github.workspace }}/cpp/viz/build/linux-release
          GVD_REQUIRE_LIVE: "1"
        run: |
          echo "GVD_REQUIRE_LIVE=${GVD_REQUIRE_LIVE}"
          xvfb-run -a python scripts/run_offline_suite.py


  rv-contract-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-viz.txt
            .github/workflows/tests.yml

      - name: Install test_rv_contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.23" "opencv-python-headless>=4.8" "PyYAML>=6.0"

      - name: Reality View contract tests
        run: python scripts/test_rv_contract.py
