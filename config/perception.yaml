# GVD perception knobs (M2+) + M5 E2E input size.
live_input_long_side: 640
lanes:
  conf_min_ok: 0.25
e2e:
  input_w: 320
  input_h: 180
  # Live image is the flat 360 strip. main+wide is only the no-stitch fallback.
  cams: [stitch360]
detector:
  prefer: yolox-nano-onnx
  allow_synthetic_default: false
  # Nerd MODEL tab / --detector: auto | synthetic | empty | yolox-*-onnx | yolov8{n,s,m,l,x}-onnx
  # yolox_nano.onnx is shipped (Apache-2.0). YOLOv8 and other YOLOX sizes are optional local files (YOLOv8 is AGPL). Lanes stay Hough.
