name: offline tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-retail.txt -r requirements-viz.txt onnx

      - name: Offline suite
        run: python scripts/run_offline_suite.py
