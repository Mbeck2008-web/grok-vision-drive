# GVD BeamNG.tech session. Used when --backend beamngpy / play_gvd_tech.bat.
# Vision-only at inference: RGB cameras + ego kinematics + GPS nav hint.
# Optional LiDAR / radar / AdvancedIMU live in config/sensors.yaml (Foxglove /
# future fusion). The corridor planner ignores them. Ultrasonic stays refused.
# GPS is a map-pin hint, not camera localization, and not a route.
#
# Env overrides (when set): GVD_BEAMNG_HOST, GVD_BEAMNG_PORT, BNG_HOME / BEAMNG_HOME,
# GVD_BEAMNG_USER, GVD_TECH_LAUNCH=0 (attach) or 1 (single BeamNGpy launch only when
# the bat did not start Tech), GVD_TECH_VEHICLE=<vid>, GVD_GPS=0/1,
# GVD_NAV_PIN_LAT, GVD_NAV_PIN_LON, GVD_NAV_PIN_NAME, GVD_LIDAR=1, GVD_RADAR=1,
# GVD_BEAMNGPY_PIN=1.35|1.36.
#
# Match BeamNGpy to the Tech build in use (0.38 → 1.35.x, 0.39 → 1.36). Live attach UNPROVEN here.

host: localhost
port: 25252
home: ""          # BeamNG.tech install dir. Empty → BNG_HOME.
                  # One starter: install-root BeamNG.tech.exe -tcom -console -gfx dx11.
                  # Do not also launch from the bat. A missing tech.key does not fail the hold.
user: ""          # Optional Tech userfolder. Empty is not a hold failure.
launch: false     # false = attach to already-running Tech. true = BeamNGpy is the only starter (port was down).
beamngpy_pin: "1.36"  # Tech 0.39. Tech 0.38 → "1.35". Prove refuses a different installed BeamNGpy.
wait_vehicle_s: 60
vehicle: current  # current = player vehicle when known, else first spawned. Or a vid string.
prefer_model: etk800

# Extra GVD-frame offset (+X right, +Y forward, +Z up) added before BeamNG vehicle-space convert.
origin_offset: [0.0, 0.0, 0.0]
vehicle_origins:
  etk800: [0.0, 0.0, 0.0]

sensors:
  electrics: true   # wheelspeed, steering_input, throttle_input, brake_input, gear, rpm
  damage: true      # ground-truth damage (not a camera)
  gforces: true     # gx/gy/gz kinematics
  gps: true         # lat/lon nav hint for a future map pin. Not localization. Not a route.
  # lidar / radar: optional attach via config/sensors.yaml (planner ignores them)

# BeamNG maps have no real-world lat/lon. ref_* put world (0, 0) on this sphere
# (Italy demo defaults from BeamNGpy GPS_trajectory.py). pos_m is GVD frame.
gps:
  pos_m: [0.0, 0.0, 1.7]
  ref_lon: 8.8017
  ref_lat: 53.0793
  visualised: false
  update_s: 0.05

# Destination in the same lon/lat frame as gps.ref_*. Leave empty until you drop a pin.
# The corridor planner does not follow this yet (nav.mode stays "hint").
nav:
  pin_lat: ~
  pin_lon: ~
  pin_name: ""

cameras:
  attach: true
  rgb_only: true
  convert_gvd_frame: true   # cameras.yaml is GVD frame; BeamNGpy Camera is +X left +Y back +Z up
  update_s: 0.067           # forward default; cameras.yaml requested_update_time wins (sides/rear -1 on-demand)
  shared_memory: true
  streaming: true           # stream_raw on forwards; never set false
